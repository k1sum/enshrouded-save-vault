name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Server tests
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Client core checks
        run: dotnet run --project client/CoreChecks/CoreChecks.csproj

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux servers
        run: sh scripts/build-server.sh
      - name: Windows client (single self-contained exe)
        run: sh scripts/build-windows.sh
      - name: Name release files
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          mkdir -p out
          cp dist/windows-x64/EnshroudedSaveManager.exe "out/EnshroudedSaveManager-$v-win-x64.exe"
          cp dist/linux-amd64/save-server "out/save-server-$v-linux-amd64"
          cp dist/linux-arm64/save-server "out/save-server-$v-linux-arm64"
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: enshrouded-save-vault
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enshrouded-save-vault
          path: out
      # The release page shows the hand-written bilingual notes for this tag.
      - uses: softprops/action-gh-release@v2
        with:
          name: 雾锁存档助手 ${{ github.ref_name }} / Enshrouded Save Vault ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: out/*
